<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="c3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0c0d11" />
    </linearGradient>
    <linearGradient id="c3-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="c3-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Icon Badge: Calibrated LA✦ with Exact Website Amber -->
  <g transform="translate(6, 6) scale(0.52)">
    <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#c3-bg)" stroke="#27272a" stroke-width="2.5" />

    <!-- Letter L (Solid Off-White/Clean White) -->
    <path d="M 22 30 H 34 V 60 H 47 V 70 H 22 Z" fill="#ffffff" />

    <!-- Letter A (Calibrated Warm Amber Gradient, Wide Stance, Open Triangle) -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 49 70 L 61 30 H 70 L 82 70 H 71.5 L 69.3 61 H 61.7 L 59.5 70 H 49 Z M 65.5 38.5 L 62.2 52 H 68.8 L 65.5 38.5 Z" fill="url(#c3-amber)" />

    <!-- 4-Point Sparkle ✦ Star (Warm Luminous Gold) -->
    <path d="M 80 13 C 80 17.5 83.5 21 87.5 21 C 83.5 21 80 24.5 80 29 C 80 24.5 76.5 21 72.5 21 C 76.5 21 80 17.5 80 13 Z" fill="url(#c3-amber)" filter="url(#c3-glow)" />
  </g>

  <!-- Wordmark -->
  <text x="68" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.035em">
    <tspan fill="#ffffff">listaiassets</tspan>
    <tspan fill="url(#c3-amber)">.com</tspan>
  </text>
</svg>

